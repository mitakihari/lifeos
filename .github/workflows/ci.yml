name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # surface failures as annotations (readable through the API)
          { grep -E "^(FAILED|ERROR|E  )" pytest.log || true; } | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - name: Check setup-windows.ps1 parses
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup-windows.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_ }; exit 1 }
